name: Build MobileGL Plugin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      versionName:
        description: release build full versionName e.g. 26.11.1-rc.2; leave empty for dev build with -DevN suffix
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore release keystore from secret
        working-directory: android-plugin-ui
        env:
          SIGNING_STORE_FILE_BASE64: ${{ secrets.SIGNING_STORE_FILE_BASE64 }}
        run: |
          echo "$SIGNING_STORE_FILE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks

      - name: Resolve display version (DevN for non-release builds)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n '${{ github.event.inputs.versionName }}' ]; then
            echo "DISPLAY_VERSION=${{ github.event.inputs.versionName }}" >> "$GITHUB_ENV"
            echo "RELEASE_BUILD=1" >> "$GITHUB_ENV"
          else
            BASE=$(gradle --no-daemon -q -p android-plugin-ui :app:printBaseVersion | tail -1)
            echo "base version: $BASE"
            DEVN=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq '[.[].tag_name | select(startswith("$BASE-Dev"))] | map(ltrimstr("$BASE-Dev") | tonumber) | max // 0' \
              | awk '{print $1+1}')
            [ -z "$DEVN" ] && DEVN=1
            echo "DevN: $DEVN"
            echo "DISPLAY_VERSION=$BASE-Dev$DEVN" >> "$GITHUB_ENV"
            echo "RELEASE_BUILD=0" >> "$GITHUB_ENV"
          fi

      - name: Build plugin APK (release)
        working-directory: android-plugin-ui
        env:
          ORG_GRADLE_PROJECT_mobilegl.prebuiltLibsDir: ${{ github.workspace }}/android-plugin-ui/prebuilt
          ORG_GRADLE_PROJECT_mobilegl.sfpew: 'true'
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VER_ARGS=""
          if [ "$RELEASE_BUILD" = "1" ]; then
            VER_ARGS="-Pmobilegl.versionNameOverride='$DISPLAY_VERSION' -Pmobilegl.versionGitHash=false"
          else
            VER_ARGS="-Pmobilegl.versionNameOverride='$DISPLAY_VERSION' -Pmobilegl.versionGitHash=true"
          fi
          gradle --no-daemon $VER_ARGS -Pmobilegl.prebuiltLibsDir="$GITHUB_WORKSPACE/android-plugin-ui/prebuilt" -Pmobilegl.sfpew=true :app:assembleMagmaPluginRelease

      - name: Collect artifact (rename with version)
        working-directory: android-plugin-ui
        run: |
          VERSION=$(gradle --no-daemon -q :app:printVersionName -Pmobilegl.versionNameOverride=$DISPLAY_VERSION | tail -1)
          echo "versionName=$VERSION"
          cp app/build/outputs/apk/magmaPlugin/release/MobileGL-MagmaPlugin-release.apk \
             "../MobileGL-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MobileGL-plugin-apk
          path: MobileGL-*.apk