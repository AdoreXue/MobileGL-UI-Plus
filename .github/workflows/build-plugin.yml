name: Build MobileGL Plugin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build plugin APK
        working-directory: android-plugin-ui
        env:
          ORG_GRADLE_PROJECT_mobilegl.prebuiltLibsDir: ${{ github.workspace }}/android-plugin-ui/prebuilt
          ORG_GRADLE_PROJECT_mobilegl.sfpew: 'true'
        run: gradle --no-daemon -Pmobilegl.prebuiltLibsDir="$GITHUB_WORKSPACE/android-plugin-ui/prebuilt" -Pmobilegl.sfpew=true -Pmobilegl.versionGitHash=true :app:assembleMagmaPluginDebug

      - name: Collect artifact (rename with version)
        working-directory: android-plugin-ui
        run: |
          VERSION=$(gradle --no-daemon -q :app:printVersionName | tail -1)
          echo "versionName=$VERSION"
          cp app/build/outputs/apk/magmaPlugin/debug/MobileGL-MagmaPlugin-debug.apk \
             "../MobileGL-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MobileGL-plugin-apk
          path: MobileGL-*.apk