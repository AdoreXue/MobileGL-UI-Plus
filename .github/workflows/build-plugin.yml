name: Build MobileGL Plugin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore release keystore from secret
        working-directory: android-plugin-ui
        env:
          SIGNING_STORE_FILE_BASE64: ${{ secrets.SIGNING_STORE_FILE_BASE64 }}
        run: |
          echo "$SIGNING_STORE_FILE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks

      - name: Build plugin APK (release)
        working-directory: android-plugin-ui
        env:
          ORG_GRADLE_PROJECT_mobilegl.prebuiltLibsDir: ${{ github.workspace }}/android-plugin-ui/prebuilt
          ORG_GRADLE_PROJECT_mobilegl.sfpew: 'true'
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon -Pmobilegl.prebuiltLibsDir="$GITHUB_WORKSPACE/android-plugin-ui/prebuilt" -Pmobilegl.sfpew=true -Pmobilegl.versionGitHash=true :app:assembleMagmaPluginRelease

      - name: Collect artifact (rename with version)
        working-directory: android-plugin-ui
        run: |
          VERSION=$(gradle --no-daemon -q :app:printVersionName | tail -1)
          echo "versionName=$VERSION"
          cp app/build/outputs/apk/magmaPlugin/release/MobileGL-MagmaPlugin-release.apk \
             "../MobileGL-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MobileGL-plugin-apk
          path: MobileGL-*.apk