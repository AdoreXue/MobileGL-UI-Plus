plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// When set, the APK packages .so files from this directory (arm64-v8a/...)
// instead of building :MobileGL from source. Used to ship official CI .so files
// and to bundle SimpleFPEWrapper.
def mobileGlPrebuiltLibsDir = (findProperty('mobilegl.prebuiltLibsDir') ?: System.getenv('ORG_GRADLE_PROJECT_mobilegl.prebuiltLibsDir') ?: '').toString().trim()
def mobileGlUseSfpew = (findProperty('mobilegl.sfpew') ?: (mobileGlPrebuiltLibsDir ? 'true' : 'false')).toString().toBoolean()

def mobileGlEnvString = { backendType ->
    def env = [
            LIBGL_ES             : '3',
            POJAV_RENDERER       : 'opengles3',
            MOBILEGL_BACKEND_TYPE: backendType,
    ]
    if (mobileGlUseSfpew) {
        env['SFPEW_EGL'] = 'libMobileGL.so'
    }
    env.collect { key, value -> "${key}=${value}" }.join(':')
}
def signingStoreFile = file('../keystore.jks')
def signingStorePassword = System.getenv('SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('SIGNING_KEY_PASSWORD')
def releaseSigningReady = signingStoreFile.exists()
        && signingStorePassword
        && signingKeyAlias
        && signingKeyPassword
def debuggableRelease = (findProperty('mobilegl.debuggableRelease') ?: 'false').toString().toBoolean()
def mobileGlCmakeCompilerLauncher = {
    (findProperty('mobilegl.cmakeCompilerLauncher') ?: System.getenv('MOBILEGL_CMAKE_COMPILER_LAUNCHER') ?: '').toString().trim()
}
def mobileGlAbiFilters = {
    def abiList = (findProperty('mobilegl.abis') ?: System.getenv('MOBILEGL_ABIS') ?: 'arm64-v8a') as String
    if (abiList.equalsIgnoreCase('all')) {
        return ['arm64-v8a', 'x86_64']
    }
    abiList
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
}

// RendererPlugin-v2 (Zalith Launcher) config. This mirrors the upstream Kotlin DSL
// output: a JSON document stored in @string/config and referenced from the
// "fclPlugin_V2" manifest meta-data. The launcher substitutes the "**|" prefix with
// the plugin's real nativeLibraryDir at launch time.
// Launcher-facing renderer name is intentionally backend-agnostic.
def mobileGlRendererDisplayName = { String backendType -> 'MobileGL' }
def mobileGlMinMCVer = null
def mobileGlMaxMCVer = null
def mobileGlRendererConfig = { String backendType ->
    def values = ['DirectGLES', 'DirectVulkan']
    def env = [
            [type: 'NormalEnv', key: 'LIBGL_ES', value: '3'],
            [type: 'NormalEnv', key: 'POJAV_RENDERER', value: 'opengles3'],
            [type: 'SelectableEnv', key: 'MOBILEGL_BACKEND_TYPE',
             title: [key: 'mobilegl_backend_type_title'], check: true,
             items: [defaultValue: backendType, values: values]],
            [type: 'ToggleableEnv', key: 'MOBILEGL_DISABLE_TIMERQUERY', value: '1',
             title: [key: 'mobilegl_disable_timerquery_title'], toggle: false],
            [type: 'SelectableEnv', key: 'MOBILEGL_SUBGROUP_EMULATION',
             title: [key: 'mobilegl_disable_subgroup_title'],
             items: [defaultValue: 'Auto', values: ['Auto', 'ForceOn', 'ForceOff']]],
            [type: 'ToggleableEnv', key: 'MOBILEGL_MAGMA_R11G11B10F_FALLBACK', value: '1',
             title: [key: 'mobilegl_r11g11b10f_fallback_title'], toggle: false],
            [type: 'CustomizableEnv', key: 'MOBILEGL_FRAMES_IN_FLIGHT', defaultValue: '3'],
            [type: 'ToggleableEnv', key: 'MOBILEGL_ESPRYT_USE_ANGLE', value: '1', toggle: false],
            [type: 'ToggleableEnv', key: 'MOBILEGL_COHERENT_AS_FLUSH', value: '1', toggle: false],
            [type: 'ToggleableEnv', key: 'MOBILEGL_RELAXED_SEMANTICS', value: '1', toggle: false],
    ]
    def glLib = !mobileGlPrebuiltLibsDir.isEmpty()
            ? '**|libRendererProxy.so'
            : (mobileGlUseSfpew ? '**|libSimpleFPEWrapper.so' : '**|libMobileGL.so')
    def config = [
            displayName    : mobileGlRendererDisplayName(backendType),
            rendererId     : 'opengles3',
            rendererGLPath : glLib,
            rendererEGLPath: glLib,
            dlopenLibPaths : [],
            env            : env,
            minMCVer       : mobileGlMinMCVer,
            maxMCVer       : mobileGlMaxMCVer,
    ]
    groovy.json.JsonOutput.toJson(config).replace('"', '\\"')
}

// Calendar versioning: major = two-digit year, minor = month, taken from the
// HEAD commit date (not the build machine clock) so the number is reproducible
// and never goes stale. Override with -Pmobilegl.versionYear/-P...Month.
def mobileGlHeadDate = {
    try {
        def proc = ['git', 'log', '-1', '--format=%cd', '--date=format:%Y-%m', 'HEAD'].execute(null, rootDir)
        proc.waitFor()
        def d = proc.in.text.trim()
        (proc.exitValue() == 0 && d ==~ /\d{4}-\d{2}/) ? d : null
    } catch (Exception ignored) {
        null
    }
}()
def mobileGlVersionMajor = (findProperty('mobilegl.versionYear') ?:
        (mobileGlHeadDate ? mobileGlHeadDate.split('-')[0].toInteger() % 100 : 26)).toInteger()
def mobileGlVersionMinor = (findProperty('mobilegl.versionMonth') ?:
        (mobileGlHeadDate ? mobileGlHeadDate.split('-')[1].toInteger() : 11)).toInteger()
// 当月第几次发布：默认 = HEAD 日期当月内的提交数（自动单调递增）；
// 同月重发且无新提交时用 -Pmobilegl.versionRevision=N 覆盖
def mobileGlVersionRevision = {
    def over = findProperty('mobilegl.versionRevision')
    if (over != null) return over.toInteger()
    try {
        if (mobileGlHeadDate == null) return 1
        def since = String.format('20%02d-%02d-01T00:00:00', mobileGlVersionMajor, mobileGlVersionMinor)
        // 只数本仓库作者当月提交，上游历史不计入
        def author = ['git', 'config', 'user.email'].execute(null, rootDir)
        author.waitFor()
        def email = author.in.text.trim() ?: 'xuhexue@users.noreply.github.com'
        def proc = ['git', 'rev-list', '--count', '--author=' + email, "--since=" + since, 'HEAD'].execute(null, rootDir)
        proc.waitFor()
        def n = proc.in.text.trim()
        (proc.exitValue() == 0 && n) ? Math.max(1, n.toInteger()) : 1
    } catch (Exception ignored) { 1 }
}()
// 本 fork 的构建标记：默认跟随当月修订号（全自动）；
// UI/打包逻辑大改想单独区分时用 -Pmobilegl.buildRevision=N 覆盖
def mobileGlForkBuildRevision = {
    def over = findProperty('mobilegl.buildRevision')
    (over ?: mobileGlVersionRevision.toString()).toInteger()
}()
def mobileGlGitShortHash = {
    try {
        def proc = ['git', 'rev-parse', '--short=7', 'HEAD'].execute(null, rootDir)
        proc.waitFor()
        def hash = proc.in.text.trim()
        (proc.exitValue() == 0 && hash) ? hash : 'nogit'
    } catch (Exception ignored) {
        'nogit'
    }
}()
// CI 构建时附加短 commit hash，便于定位源码；本地默认不加
def mobileGlAppendGitHash = (findProperty('mobilegl.versionGitHash') ?: 'false').toString().toBoolean()
def mobileGlForkVersionName = {
    def base = "${mobileGlVersionMajor}.${mobileGlVersionMinor}.${mobileGlVersionRevision}-build${mobileGlForkBuildRevision}"
    mobileGlAppendGitHash ? base + "-${mobileGlGitShortHash}" : base
}()

android {
    namespace 'top.mobilegl.plugin'
    compileSdk 34
    ndkVersion '27.3.13750724'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    defaultConfig {
        buildConfigField 'boolean', 'SFPEW_BUNDLED', mobileGlUseSfpew.toString()
        buildConfigField 'String', 'GIT_HASH', "\"${mobileGlGitShortHash}\""
    }

    defaultConfig {
        minSdk 26
        targetSdk 34
        // year*1_000_000 + month*10_000 + monthly revision keeps versionCode
        // strictly increasing across releases (monotonic within a month and
        // across month/year rollovers), so every build is an installable
        // upgrade. Max ~99_129999, well under Android's 2_100_000_000 ceiling.
        // 年*1e6 + 月*1e4 + 当月修订，随 HEAD 日期单调递增
        versionCode mobileGlVersionMajor * 1000000 + mobileGlVersionMinor * 10000 + mobileGlVersionRevision
        versionName mobileGlForkVersionName

        ndk {
            def abiFiltersOverride = mobileGlAbiFilters()
            if (!abiFiltersOverride.isEmpty()) {
                abiFilters(*abiFiltersOverride)
            }
        }
        externalNativeBuild {
            cmake {
                def compilerLauncher = mobileGlCmakeCompilerLauncher()
                if (!compilerLauncher.isEmpty()) {
                    arguments "-DCMAKE_C_COMPILER_LAUNCHER=${compilerLauncher}",
                            "-DCMAKE_CXX_COMPILER_LAUNCHER=${compilerLauncher}"
                }
            }
        }
    }

    flavorDimensions 'backend', 'profile'

    productFlavors {
        espryt {
            dimension 'backend'
            applicationId 'top.mobilegl.plugin.espryt'
            def env = mobileGlEnvString('DirectGLES')
            resValue 'string', 'mobilegl_default_backend', 'DirectGLES'
            resValue 'string', 'config', mobileGlRendererConfig('DirectGLES')
            manifestPlaceholders = [
                    appLabel: 'MobileGL_UI',
                    des     : '来自 MobileGL_UI',
                    renderer: !mobileGlPrebuiltLibsDir.isEmpty() ? mobileGlRendererDisplayName('DirectGLES') + ':libRendererProxy.so:/libRendererProxy.so' : (mobileGlUseSfpew ? mobileGlRendererDisplayName('DirectGLES') + ':libSimpleFPEWrapper.so:/libSimpleFPEWrapper.so' : mobileGlRendererDisplayName('DirectGLES') + ':libMobileGL.so:/libMobileGL.so'),
                    minMCVer: mobileGlMinMCVer ?: '',
                    maxMCVer: mobileGlMaxMCVer ?: '',
                    boatEnv : env,
                    pojavEnv: env,
            ]
        }
        magma {
            dimension 'backend'
            // .plus 后缀：与上游/官方插件共存（同一设备可并存安装），呼应仓库名 MobileGL-UI-Plus
            applicationId 'top.mobilegl.plugin.magma.plus'
            def env = mobileGlEnvString('DirectVulkan')
            resValue 'string', 'mobilegl_default_backend', 'DirectVulkan'
            resValue 'string', 'config', mobileGlRendererConfig('DirectVulkan')
            manifestPlaceholders = [
                    appLabel: 'MobileGL_UI',
                    des     : '来自 MobileGL_UI',
                    renderer: !mobileGlPrebuiltLibsDir.isEmpty() ? mobileGlRendererDisplayName('DirectVulkan') + ':libRendererProxy.so:/libRendererProxy.so' : (mobileGlUseSfpew ? mobileGlRendererDisplayName('DirectVulkan') + ':libSimpleFPEWrapper.so:/libSimpleFPEWrapper.so' : mobileGlRendererDisplayName('DirectVulkan') + ':libMobileGL.so:/libMobileGL.so'),
                    minMCVer: mobileGlMinMCVer ?: '',
                    maxMCVer: mobileGlMaxMCVer ?: '',
                    boatEnv : env,
                    pojavEnv: env,
            ]
        }
        plugin {
            dimension 'profile'
        }
        trace {
            dimension 'profile'
            applicationIdSuffix '.trace'
            versionNameSuffix '-trace'
        }
    }

    def fixedDebugKeystore = file('../debug.keystore')
    if (fixedDebugKeystore.exists()) {
        signingConfigs {
            debug {
                storeFile fixedDebugKeystore
                storePassword 'android'
                keyAlias 'mobilegl'
                keyPassword 'android'
            }
        }
    }

    if (releaseSigningReady) {
        signingConfigs {
            release {
                storeFile signingStoreFile
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (fixedDebugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
            versionNameSuffix '-debug'
        }
        release {
            debuggable debuggableRelease
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    // The trace-replay runner is only needed when this project builds its own
    // native sources; prebuilt/official .so builds skip it (and need no NDK).
    if (mobileGlPrebuiltLibsDir.isEmpty()) {
        externalNativeBuild {
            cmake {
                path file('src/trace/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            excludes += ['**/libSPIRV-Tools-shared.so']
        }
    }

    sourceSets {
        main {
            if (!mobileGlPrebuiltLibsDir.isEmpty()) {
                jniLibs.srcDirs += mobileGlPrebuiltLibsDir
            }
        }
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
        outputFileName = "MobileGL-${variant.flavorName.capitalize()}-${variant.buildType.name}.apk"
    }
}

androidComponents {
    onVariants(selector().withFlavor('profile', 'plugin')) { variant ->
        variant.packaging.jniLibs.excludes.add('**/libtrace_replay_runner.so')
    }
}

dependencies {
    // Official/prebuilt .so mode skips the native MobileGL module entirely.
    if (mobileGlPrebuiltLibsDir.isEmpty()) {
        implementation project(':MobileGL')
    }

    // Compose configuration UI (Material 3). Versions are pinned so the APK build is reproducible.
    // Compose 1.6.8 is the last line that builds with compileSdk 34 (the plugin module
    // still targets 34); it is sufficient for all APIs used here.
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.compose.material:material-icons-core:1.6.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
// CI 用：打印 versionName，供工作流重命名 APK 文件
tasks.register('printVersionName') {
    doLast {
        println android.defaultConfig.versionName
    }
}
