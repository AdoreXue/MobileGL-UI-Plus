plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// When set, the APK packages .so files from this directory (arm64-v8a/...)
// instead of building :MobileGL from source. Used to ship official CI .so files
// and to bundle SimpleFPEWrapper.
def mobileGlPrebuiltLibsDir = (findProperty('mobilegl.prebuiltLibsDir') ?: System.getenv('ORG_GRADLE_PROJECT_mobilegl.prebuiltLibsDir') ?: '').toString().trim()
def mobileGlUseSfpew = (findProperty('mobilegl.sfpew') ?: (mobileGlPrebuiltLibsDir ? 'true' : 'false')).toString().toBoolean()

def mobileGlEnvString = { backendType ->
    def env = [
            LIBGL_ES             : '3',
            POJAV_RENDERER       : 'opengles3',
            MOBILEGL_BACKEND_TYPE: backendType,
    ]
    if (mobileGlUseSfpew) {
        env['SFPEW_EGL'] = 'libMobileGL.so'
    }
    env.collect { key, value -> "${key}=${value}" }.join(':')
}
def signingStoreFile = file('../keystore.jks')
def signingStorePassword = System.getenv('SIGNING_STORE_PASSWORD')
def signingKeyAlias = System.getenv('SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('SIGNING_KEY_PASSWORD')
def releaseSigningReady = signingStoreFile.exists()
        && signingStorePassword
        && signingKeyAlias
        && signingKeyPassword
def debuggableRelease = (findProperty('mobilegl.debuggableRelease') ?: 'false').toString().toBoolean()
def mobileGlCmakeCompilerLauncher = {
    (findProperty('mobilegl.cmakeCompilerLauncher') ?: System.getenv('MOBILEGL_CMAKE_COMPILER_LAUNCHER') ?: '').toString().trim()
}
def mobileGlAbiFilters = {
    def abiList = (findProperty('mobilegl.abis') ?: System.getenv('MOBILEGL_ABIS') ?: 'arm64-v8a') as String
    if (abiList.equalsIgnoreCase('all')) {
        return ['arm64-v8a', 'x86_64']
    }
    abiList
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
}

// RendererPlugin-v2 (Zalith Launcher) config. This mirrors the upstream Kotlin DSL
// output: a JSON document stored in @string/config and referenced from the
// "fclPlugin_V2" manifest meta-data. The launcher substitutes the "**|" prefix with
// the plugin's real nativeLibraryDir at launch time.
// Launcher-facing renderer name is intentionally backend-agnostic.
def mobileGlRendererDisplayName = { String backendType -> 'MobileGL' }

// The renderer library the launcher loads: a prebuilt or official .so goes through the proxy,
// and a build from source picks its name by whether SFPEW is bundled.
// The returned name already carries the lib prefix, so callers must not add it again.
def mobileGlRendererLibName = {
    if (!mobileGlPrebuiltLibsDir.isEmpty()) return 'libRendererProxy.so'
    if (mobileGlUseSfpew) return 'libSimpleFPEWrapper.so'
    return 'libMobileGL.so'
}
// RendererPlugin-v2 takes the "**|" prefix so the launcher substitutes its own nativeLibraryDir;
// the older fclPlugin metadata wants the bare library name.
def mobileGlRendererLib = { String prefix -> prefix + mobileGlRendererLibName() }
def mobileGlRendererConfig = { String backendType ->
    def values = ['DirectGLES', 'DirectVulkan']
    def env = [
            [type: 'NormalEnv', key: 'LIBGL_ES', value: '3'],
            [type: 'NormalEnv', key: 'POJAV_RENDERER', value: 'opengles3'],
            [type: 'SelectableEnv', key: 'MOBILEGL_BACKEND_TYPE',
             title: [key: 'mobilegl_backend_type_title'], check: true,
             items: [defaultValue: backendType, values: values]],
            [type: 'ToggleableEnv', key: 'MOBILEGL_DISABLE_TIMERQUERY', value: '1',
             title: [key: 'mobilegl_disable_timerquery_title'], toggle: false],
            [type: 'SelectableEnv', key: 'MOBILEGL_SUBGROUP_EMULATION',
             title: [key: 'mobilegl_disable_subgroup_title'],
             items: [defaultValue: 'Auto', values: ['Auto', 'ForceOn', 'ForceOff']]],
            [type: 'ToggleableEnv', key: 'MOBILEGL_MAGMA_R11G11B10F_FALLBACK', value: '1',
             title: [key: 'mobilegl_r11g11b10f_fallback_title'], toggle: false],
            [type: 'CustomizableEnv', key: 'MOBILEGL_FRAMES_IN_FLIGHT', defaultValue: '3'],
            [type: 'ToggleableEnv', key: 'MOBILEGL_ESPRYT_USE_ANGLE', value: '1', toggle: false],
            [type: 'ToggleableEnv', key: 'MOBILEGL_COHERENT_AS_FLUSH', value: '1', toggle: false],
            [type: 'ToggleableEnv', key: 'MOBILEGL_RELAXED_SEMANTICS', value: '1', toggle: false],
    ]
    def glLib = mobileGlRendererLib('**|')
    def config = [
            displayName    : mobileGlRendererDisplayName(backendType),
            rendererId     : 'opengles3',
            rendererGLPath : glLib,
            rendererEGLPath: glLib,
            dlopenLibPaths : [],
            env            : env,
            minMCVer       : '',
            maxMCVer       : '',
    ]
    groovy.json.JsonOutput.toJson(config).replace('"', '\\"')
}

// What the backend flavors share: placeholders, environment variables and resValue appear once.
def mobileGlBackendFlavor = { flavor, String backend, String appId ->
    def env = mobileGlEnvString(backend)
    def lib = mobileGlRendererLibName()
    flavor.dimension 'backend'
    flavor.applicationId = appId
    flavor.resValue 'string', 'mobilegl_default_backend', backend
    flavor.resValue 'string', 'config', mobileGlRendererConfig(backend)
    flavor.manifestPlaceholders = [
            appLabel: 'MobileGL_UI_Plus',
            des     : '来自 MobileGL_UI',
            renderer: mobileGlRendererDisplayName(backend) + ':' + lib + ':/' + lib,
            minMCVer: '',
            maxMCVer: '',
            boatEnv : env,
            pojavEnv: env,
    ]
}

// Calendar versioning: major = two-digit year, minor = month, taken from the
// HEAD commit date (not the build machine clock) so the number is reproducible
// and never goes stale. Override with -Pmobilegl.versionYear/-P...Month.
def mobileGlHeadDate = {
    try {
        def proc = ['git', 'log', '-1', '--format=%cd', '--date=format:%Y-%m', 'HEAD'].execute(null, rootDir)
        proc.waitFor()
        def d = proc.in.text.trim()
        (proc.exitValue() == 0 && d ==~ /\d{4}-\d{2}/) ? d : null
    } catch (Exception ignored) {
        null
    }
}()
def mobileGlVersionMajor = (findProperty('mobilegl.versionYear') ?:
        (mobileGlHeadDate ? mobileGlHeadDate.split('-')[0].toInteger() % 100 : 26)).toInteger()
def mobileGlVersionMinor = (findProperty('mobilegl.versionMonth') ?:
        (mobileGlHeadDate ? mobileGlHeadDate.split('-')[1].toInteger() : 11)).toInteger()
// Version revision (the x in 26.11.x): a fixed constant the maintainer sets by hand; it does not
// follow the commit count. Update this one number, or override it for a single build with
// -Pmobilegl.versionRevision=N.
def mobileGlVersionRevision = (findProperty('mobilegl.versionRevision') ?: 1).toInteger()
// This fork's build number (buildN): by default the author's commit count in the current month,
// so it grows with each build of the month; pin it with -Pmobilegl.buildRevision=N.
def mobileGlForkBuildRevision = {
    def over = findProperty('mobilegl.buildRevision')
    if (over != null) return over.toInteger()
    try {
        if (mobileGlHeadDate == null) return 1
        def since = String.format('20%02d-%02d-01T00:00:00', mobileGlVersionMajor, mobileGlVersionMinor)
        // Count only this author's commits in the current month; imported upstream history does
        // not count. The author commits under two addresses: the GitHub noreply one that git push
        // uses, and the account address that the web UI and the Contents API use.
        def n = 0
        ['xuhexue@users.noreply.github.com', 'xiaoxuelive@outlook.com'].each { email ->
            def proc = ['git', 'rev-list', '--count', '--author=' + email, "--since=" + since, 'HEAD'].execute(null, rootDir)
            proc.waitFor()
            def v = proc.in.text.trim()
            if (proc.exitValue() == 0 && v) n = Math.max(n, v.toInteger())
        }
        return n > 0 ? n : 1
    } catch (Exception ignored) { 1 }
}()
def mobileGlGitShortHash = {
    try {
        def proc = ['git', 'rev-parse', '--short=7', 'HEAD'].execute(null, rootDir)
        proc.waitFor()
        def hash = proc.in.text.trim()
        (proc.exitValue() == 0 && hash) ? hash : 'nogit'
    } catch (Exception ignored) {
        'nogit'
    }
}()
// A CI build appends the short commit hash so an extracted library can be traced to its source;
// local builds leave it out.
def mobileGlAppendGitHash = (findProperty('mobilegl.versionGitHash') ?: 'false').toString().toBoolean()
// Public version name: the override CI passes (26.11.1-Dev.1, 26.11.1-rc.1), otherwise the base
// version. Internal version name: public version-build number-hash-build type, shown on the info
// screen only.
def mobileGlPublicVersionName = {
    def over = findProperty('mobilegl.versionNameOverride')
    if (over != null) return over.toString()
    "${mobileGlVersionMajor}.${mobileGlVersionMinor}.${mobileGlVersionRevision}"
}()
def mobileGlInternalVersionName = { String buildType ->
    "${mobileGlPublicVersionName}-build${mobileGlForkBuildRevision}-${mobileGlGitShortHash}-${buildType}"
}
def mobileGlForkVersionName = mobileGlPublicVersionName

android {
    namespace 'ui.mobilegl.plugin'
    compileSdk 34
    ndkVersion '27.3.13750724'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    defaultConfig {
        buildConfigField 'boolean', 'SFPEW_BUNDLED', mobileGlUseSfpew.toString()
        buildConfigField 'String', 'GIT_HASH', "\"${mobileGlGitShortHash}\""
    }

    defaultConfig {
        minSdk 26
        targetSdk 34
        // year*1e7 + month*1e5 + revision*1e3 + build number keeps versionCode
        // strictly increasing across releases and across the builds inside one
        // month: the build number is what changes when nothing else does, so
        // Dev.1 and Dev.2 are no longer the same installable package.
        // Worst case (year 99, last month, highest numbers) is 991_299_999, still under
        // Android's 2_100_000_000 ceiling.
        versionCode mobileGlVersionMajor * 10000000 + mobileGlVersionMinor * 100000 +
            mobileGlVersionRevision * 1000 + Math.min(mobileGlForkBuildRevision, 999)
        versionName mobileGlForkVersionName

        ndk {
            def abiFiltersOverride = mobileGlAbiFilters()
            if (!abiFiltersOverride.isEmpty()) {
                abiFilters(*abiFiltersOverride)
            }
        }
        externalNativeBuild {
            cmake {
                def compilerLauncher = mobileGlCmakeCompilerLauncher()
                if (!compilerLauncher.isEmpty()) {
                    arguments "-DCMAKE_C_COMPILER_LAUNCHER=${compilerLauncher}",
                            "-DCMAKE_CXX_COMPILER_LAUNCHER=${compilerLauncher}"
                }
            }
        }
    }

    flavorDimensions 'backend', 'profile'

    productFlavors {
        // The two backend flavors differ only in name and applicationId; the shared part is
        // configured below.
        espryt { }
        magma { }
        plugin {
            dimension 'profile'
        }
        trace {
            dimension 'profile'
            applicationIdSuffix '.trace'
            versionNameSuffix '-trace'
        }
    }

    mobileGlBackendFlavor(productFlavors.espryt, 'DirectGLES', 'ui.mobilegl.plugin.espryt')
    mobileGlBackendFlavor(productFlavors.magma, 'DirectVulkan', 'ui.mobilegl.plugin.plus')

    def fixedDebugKeystore = file('../debug.keystore')
    if (fixedDebugKeystore.exists()) {
        signingConfigs {
            debug {
                storeFile fixedDebugKeystore
                storePassword 'android'
                keyAlias 'mobilegl'
                keyPassword 'android'
            }
        }
    }

    if (releaseSigningReady) {
        signingConfigs {
            release {
                storeFile signingStoreFile
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (fixedDebugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
            versionNameSuffix '-debug'
            buildConfigField 'String', 'FULL_VERSION_NAME', "\"${mobileGlInternalVersionName('debug')}\""
        }
        release {
            debuggable debuggableRelease
            minifyEnabled false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            buildConfigField 'String', 'FULL_VERSION_NAME', "\"${mobileGlInternalVersionName('release')}\""
        }
    }

    // The trace-replay runner is only needed when this project builds its own
    // native sources; prebuilt/official .so builds skip it (and need no NDK).
    if (mobileGlPrebuiltLibsDir.isEmpty()) {
        externalNativeBuild {
            cmake {
                path file('src/trace/cpp/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            excludes += ['**/libSPIRV-Tools-shared.so']
        }
    }

    sourceSets {
        main {
            if (!mobileGlPrebuiltLibsDir.isEmpty()) {
                jniLibs.srcDirs += mobileGlPrebuiltLibsDir
            }
        }
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach {
        outputFileName = "MobileGL-${variant.flavorName.capitalize()}-${variant.buildType.name}.apk"
    }
}

androidComponents {
    onVariants(selector().withFlavor('profile', 'plugin')) { variant ->
        variant.packaging.jniLibs.excludes.add('**/libtrace_replay_runner.so')
    }
}

dependencies {
    // Official/prebuilt .so mode skips the native MobileGL module entirely.
    if (mobileGlPrebuiltLibsDir.isEmpty()) {
        implementation project(':MobileGL')
    }

    // Compose configuration UI (Material 3). Versions are pinned so the APK build is reproducible.
    // Compose 1.6.8 is the last line that builds with compileSdk 34 (the plugin module
    // still targets 34); it is sufficient for all APIs used here.
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.compose.material:material-icons-core:1.6.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
// For CI: print the versionName so the workflow can rename the APK file.
tasks.register('printVersionName') {
    doLast {
        println android.defaultConfig.versionName
    }
}

// For CI: print the base version (major.minor.revision, without the build or Dev suffix) that
// the DevN suffix is counted from.
tasks.register('printBaseVersion') {
    doLast {
        println "${mobileGlVersionMajor}.${mobileGlVersionMinor}.${mobileGlVersionRevision}"
    }
}
